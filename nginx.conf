# Minimal Nginx configuration for serving Angular on Cloud Run
events { } # Events block is required by Nginx config syntax

http {
    include /etc/nginx/mime.types; # Include default mime types for correct content serving

    server {
        listen 8080; # Cloud Run expects your container to listen on the PORT environment variable (default 8080)
        root /usr/share/nginx/html; # Directory where your Angular build output will be placed
        index index.html index.htm; # Default files to serve

        # Try to serve files directly, otherwise fall back to index.html for Angular routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Optional: Proxy API requests to the backend
        # This can be useful if you want to route all traffic through the frontend's Cloud Run URL
        # and Nginx handles the forwarding to the backend.
        # Alternatively, your Angular app can directly call the backend's Cloud Run URL.
        # If you enable this, your Angular app would call '/api/' and Nginx would proxy it.
        # location /api/ {
        #     proxy_pass https://your-spring-backend-url.a.run.app/; # Replace with your actual backend URL
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}
